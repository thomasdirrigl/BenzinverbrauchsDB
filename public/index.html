<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Benzinverbrauch-Tracker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>⛽ Benzinverbrauch-Tracker</h1>
  <p class="subtitle">Fotos hochladen, Werte pruefen, Verbrauch berechnen</p>
</header>

<main>
  <section class="card">
    <h2>Neuer Eintrag</h2>

    <div class="photo-row">
      <div class="photo-box">
        <label for="fotoKassenbon">1. Foto von Zapfsäule oder Kassenbon (Liter &amp; Preis)</label>
        <input type="file" id="fotoKassenbon" accept="image/*" capture="environment">
        <button type="button" id="btnScanKassenbon" class="secondary">Foto auslesen</button>
        <p class="hint">Am zuverlässigsten, wenn die Anzeige "MENGE" und "SUMME"/"BETRAG" mit im Bild ist.</p>
        <p class="status" id="statusKassenbon"></p>
      </div>

      <div class="photo-box">
        <label for="fotoKm">2. Tacho-/Trip-Foto (gefahrene km)</label>
        <input type="file" id="fotoKm" accept="image/*" capture="environment">
        <button type="button" id="btnScanKm" class="secondary">Foto auslesen</button>
        <p class="status" id="statusKm"></p>
      </div>
    </div>

    <form id="eintragForm">
      <div class="field-row">
        <label for="datum">Datum</label>
        <input type="date" id="datum" required>
      </div>
      <div class="field-row">
        <label for="liter">Literzahl (l)</label>
        <input type="number" id="liter" step="0.01" min="0.01" required>
      </div>
      <div class="field-row">
        <label for="km">Gefahrene km</label>
        <input type="number" id="km" step="0.1" min="0.1" required>
      </div>
      <div class="field-row">
        <label for="preis">Preis (€)</label>
        <input type="number" id="preis" step="0.01" min="0.01" required>
      </div>
      <div class="field-row">
        <label for="verbrauch">Durchschnittsverbrauch (l/100km)</label>
        <input type="text" id="verbrauch" readonly placeholder="wird berechnet">
      </div>

      <button type="submit" id="btnSpeichern">Eintrag speichern</button>
      <p class="status" id="statusSpeichern"></p>
    </form>
  </section>

  <section class="card">
    <h2>Bisherige Eintraege</h2>
    <table id="tabelle">
      <thead>
        <tr>
          <th>Datum</th>
          <th>Liter</th>
          <th>km</th>
          <th>Verbrauch (l/100km)</th>
          <th>Preis (€)</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tabelleBody"></tbody>
    </table>
    <p id="leerHinweis" class="status" hidden>Noch keine Eintraege vorhanden.</p>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
